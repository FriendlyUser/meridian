<!doctype html>
<!-- The Google Play feature graphic, 1024 x 500. tools/android/store-shots.sh takes a
     picture of this page. Open it in a browser to look at it. -->
<meta charset="utf-8">
<title>Meridian feature graphic</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1024px; height: 500px; overflow: hidden; position: relative;
    background: radial-gradient(120% 140% at 18% 20%, #17897b 0%, #0f6e63 42%, #0a4a43 100%);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #23201b;
  }
  .copy { position: absolute; left: 64px; top: 104px; width: 430px; color: #f4f1ea; }
  .mark { width: 76px; height: 76px; display: block; margin-bottom: 22px; }
  h1 { margin: 0; font: 600 68px/1 "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: -.01em; }
  .tag { margin: 18px 0 0; font-size: 25px; line-height: 1.3; color: #d7ece7; }
  .small { margin: 20px 0 0; font-size: 16px; color: #a9d2ca; letter-spacing: .02em; }

  .card { position: absolute; background: #fffdf8; border-radius: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, .28); padding: 18px 20px; }
  .card h2 { margin: 0 0 12px; font-size: 14px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8a8378; }
  .plan { right: 268px; top: 46px; width: 300px; transform: rotate(-3deg); }
  .row { display: flex; align-items: center; gap: 11px; padding: 8px 0; font-size: 17px; }
  .row + .row { border-top: 1px solid #e6e0d4; }
  .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid #d3cbbb; flex: none; }
  .tick.done { background: #0f6e63; border-color: #0f6e63; position: relative; }
  .tick.done::after { content: ""; position: absolute; left: 6px; top: 2px; width: 5px; height: 10px; border: solid #fff; border-width: 0 2.4px 2.4px 0; transform: rotate(42deg); }
  .tick.p1 { border-color: #b3261e; } .tick.p2 { border-color: #eb6834; }
  .done-text { color: #8a8378; text-decoration: line-through; }
  .chip { margin-left: auto; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #efeae0; color: #57514a; white-space: nowrap; }

  .focus { right: 38px; top: 132px; width: 210px; text-align: center; transform: rotate(4deg); }
  .ring { width: 150px; height: 150px; margin: 0 auto; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 34px; font-weight: 600; letter-spacing: -.02em; }
  .focus p { margin: 10px 0 0; font-size: 14px; color: #57514a; }

  .habits { right: 262px; top: 318px; width: 322px; transform: rotate(-1.5deg); }
  .dots { display: flex; gap: 9px; align-items: center; padding: 5px 0; font-size: 15px; }
  .dots span { width: 92px; }
  .dots i { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); opacity: .45; }
  .dots i.on { background: var(--c); opacity: 1; }
</style>
<body>
  <div class="copy">
    <svg class="mark" viewBox="20 20 68 68" aria-hidden="true">
      <circle cx="54" cy="56" r="19" fill="none" stroke="#f4f1ea" stroke-width="5"/>
      <path d="M54 33 V80" stroke="#f2b84b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="54" cy="31" r="6.2" fill="#f2b84b"/>
    </svg>
    <h1>Meridian</h1>
    <p class="tag">Tasks, habits, notes and focus.<br>One calm place for your day.</p>
    <p class="small">Works offline · No account · No ads</p>
  </div>

  <div class="card plan">
    <h2>Today</h2>
    <div class="row"><i class="tick done"></i><span class="done-text">Plan the week</span></div>
    <div class="row"><i class="tick p1"></i><span>Write the update</span><span class="chip">3 PM</span></div>
    <div class="row"><i class="tick p2"></i><span>Book flights</span><span class="chip">#home</span></div>
  </div>

  <div class="card habits">
    <h2>Habits</h2>
    <div class="dots" style="--c:#2a78d6"><span>Read</span><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
    <div class="dots" style="--c:#1baf7a"><span>Stretch</span><i class="on"></i><i></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
  </div>

  <div class="card focus">
    <div class="ring">
      <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#dcece8" stroke-width="7"/><circle cx="50" cy="50" r="44" fill="none" stroke="#0f6e63" stroke-width="7" stroke-linecap="round" stroke-dasharray="276.5" stroke-dashoffset="104"/></svg>
      <b>14:12</b>
    </div>
    <p>Stay with it</p>
  </div>
</body>
